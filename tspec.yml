# Tracer Spec Workflow configuration.
# Provider settings are user-owned; tracer-spec never creates tickets or changes ticket lifecycle state.

tracker:
  # none | github | jira
  provider: none

  # GitHub: reach the tracker via the `gh` CLI.
  # github:
  #   repo: owner/repo

  # Jira: reach the tracker via its REST API.
  # jira:
  #   url: https://your-domain.atlassian.net
  #   project: KEY
