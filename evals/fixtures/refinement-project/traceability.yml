extends: minimal

roles:
  - change
  - use_case

roleGuidance:
  change:
    page: docs/modules/specs/pages/guidance/change.adoc
    idPrefix: CHG
  use_case:
    page: docs/modules/specs/pages/guidance/use-case.adoc
    idPrefix: UC

relations:
  change:
    requirement:
      addresses:
        reverse: addressed_by
  use_case:
    requirement:
      leads_to:
        reverse: is_derived_from
  requirement:
    requirement:
      refines:
        reverse: refined_by

matrices:
  - name: changes-to-requirements
    description: Changes traced to addressed requirements
    rows: change
    columns: [requirement]
    coverageRelations:
      requirement: [addresses]
  - name: use-cases-to-requirements
    description: Use cases traced to derived requirements
    rows: use_case
    columns: [requirement]
    coverageRelations:
      requirement: [leads_to]
  - name: requirements-refinement
    description: Requirements traced to detailed requirements
    rows: requirement
    columns: [requirement]
    coverageRelations:
      requirement: [refines]
