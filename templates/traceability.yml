# Trace Spec Workflow configuration extending antora-tracer minimal.

extends: minimal

roles:
  - change
  - decision
  - use_case
  - architecture
  - design
  - adr

roleGuidance:
  change:
    page: docs/modules/specs/pages/guidance/change.adoc
    idPrefix: CHG
  decision:
    page: docs/modules/specs/pages/guidance/decision.adoc
    idPrefix: DEC
  use_case:
    page: docs/modules/specs/pages/guidance/use-case.adoc
    idPrefix: UC
  architecture:
    page: docs/modules/specs/pages/guidance/architecture.adoc
    idPrefix: ARC
  design:
    page: docs/modules/specs/pages/guidance/design.adoc
    idPrefix: DSN
  adr:
    page: docs/modules/specs/pages/guidance/adr.adoc
    idPrefix: ADR

relations:
  change:
    requirement:
      addresses:
        reverse: addressed_by
    decision:
      records:
        reverse: recorded_by
    design:
      records:
        reverse: recorded_by
    adr:
      records:
        reverse: recorded_by
    architecture:
      updates:
        reverse: updated_by
    change:
      refines:
        reverse: refined_by
  use_case:
    requirement:
      leads_to:
        reverse: is_derived_from
  requirement:
    requirement:
      refines:
        reverse: refined_by
  design:
    requirement:
      realizes:
        reverse: realized_by
    architecture:
      affects:
        reverse: affected_by
    adr:
      references:
        reverse: referenced_by
  architecture:
    architecture:
      composes:
        reverse: part_of
    requirement:
      realizes:
        reverse: realized_by
  adr:
    requirement:
      addresses:
        reverse: addressed_by
    architecture:
      decides:
        reverse: decided_by
  decision:
    decision:
      supersedes:
        reverse: superseded_by

matrices:
  - name: changes-to-requirements
    description: Changes traced to addressed requirements
    rows: change
    columns: [requirement]
    coverageRelations:
      requirement: [addresses]
  - name: use-cases-to-requirements
    description: Use cases traced to derived requirements
    rows: use_case
    columns: [requirement]
    coverageRelations:
      requirement: [leads_to]
  - name: requirements-refinement
    description: Requirements traced to more detailed requirements
    rows: requirement
    columns: [requirement]
    coverageRelations:
      requirement: [refines]
  - name: architecture-to-requirements
    description: Architecture elements traced to realized requirements
    rows: architecture
    columns: [requirement]
    coverageRelations:
      requirement: [realizes]
  - name: designs-to-requirements
    description: Change designs traced to realized requirements
    rows: design
    columns: [requirement]
    coverageRelations:
      requirement: [realizes]

workflow:
  architecture:
    states: [accepted, superseded]
    transitions:
      accepted: [superseded]
  design:
    states: [proposed, accepted, superseded]
    transitions:
      proposed: [accepted, superseded]
      accepted: [superseded]
  decision:
    states: [proposed, accepted, rejected, superseded]
    transitions:
      proposed: [accepted, rejected, superseded]
      accepted: [superseded]
  adr:
    states: [proposed, accepted, rejected, superseded]
    transitions:
      proposed: [accepted, rejected, superseded]
      accepted: [superseded]
validation:
  change:
    accepted:
      requiresRoles: [requirement]
