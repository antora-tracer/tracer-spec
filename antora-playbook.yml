site:
  title: Tracer Spec Workflow
  start_page: tracer-spec:specs:index.adoc
content:
  sources:
    - url: .
      start_path: docs
      branches: HEAD
antora:
  extensions:
    - require: '@antora-tracer/core/antora-extension'
      config:
        configPath: traceability.yml
        generateMatrices: true
        generateCoverage: true
ui:
  bundle:
    url: https://github.com/rattermeyer/antora-ui-conemso/releases/download/v1.2.0/ui-bundle.zip

runtime:
  log:
    level: warn
