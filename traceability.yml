# Trace Spec Workflow — self-traceability model
# Spec-driven development: a minimal Tier-1 core (change + requirement) with growable Tier-2 roles.
extends: minimal

roles:
  - change
  - decision
  - use_case

roleGuidance:
  change:
    page: docs/modules/specs/pages/guidance/change.adoc
    idPrefix: CHG
  decision:
    page: docs/modules/specs/pages/guidance/decision.adoc
    idPrefix: DEC
  use_case:
    page: docs/modules/specs/pages/guidance/use-case.adoc
    idPrefix: UC

relations:
  change:
    requirement:
      addresses:
        reverse: addressed_by
    decision:
      records:
        reverse: recorded_by
  use_case:
    requirement:
      leads_to:
        reverse: is_derived_from
  requirement:
    requirement:
      refines:
        reverse: refined_by

matrices:
  - name: changes-to-requirements
    description: Changes traced to addressed requirements
    rows: change
    columns: [requirement]
    coverageRelations:
      requirement: [addresses]
  - name: use-cases-to-requirements
    description: Use cases traced to derived requirements
    rows: use_case
    columns: [requirement]
    coverageRelations:
      requirement: [leads_to]
  - name: requirements-refinement
    description: Requirements traced to more detailed requirements
    rows: requirement
    columns: [requirement]
    coverageRelations:
      requirement: [refines]

workflow:
  change:
    states: [proposed, refined, accepted, implemented, verified, closed, rejected]
    transitions:
      proposed: [refined, rejected]
      refined: [accepted, proposed]
      accepted: [implemented, rejected]
      implemented: [verified, accepted]
      verified: [closed, implemented]
  requirement:
    states: [draft, reviewed, approved, superseded, withdrawn]
    transitions:
      draft: [reviewed, withdrawn]
      reviewed: [approved, draft]
      approved: [superseded]
  decision:
    states: [proposed, accepted, rejected, superseded]
    transitions:
      proposed: [accepted, rejected]
      accepted: [superseded]

validation:
  change:
    accepted:
      requiresRoles: [requirement]
